{% extends "auth/base.html" %}
{% block auth_content %}
<form class="glass-form" data-auth-form="register" method="POST" action="javascript:void(0)">
  <div>
    <p class="eyebrow">NEW WALLET NODE</p>
    <h2>Register</h2>
  </div>
  <p class="form-error" data-auth-error hidden></p>
  <p class="form-success" data-auth-success hidden></p>
  <label>Name
    <input name="username" type="text" autocomplete="name" required placeholder="Daivik">
  </label>
  <label>Email
    <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
  </label>
  <label class="password-field">Password
    <div class="password-input-wrap">
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </label>
  <label class="password-field">Confirm Password
    <div class="password-input-wrap">
      <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </label>
  <button class="dos-btn primary" type="submit">Create D-OS Account</button>
  <button class="dos-btn ghost" type="button" data-google-login>Google Login</button>
  <div class="auth-links">
    <a href="/login">Back to login</a>
  </div>
</form>
{% endblock %}
