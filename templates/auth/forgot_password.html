{% extends "auth/base.html" %}
{% block auth_content %}
<form class="glass-form" data-auth-form="forgot">
  <div>
    <p class="eyebrow">LOCAL RECOVERY</p>
    <h2>Forgot Password</h2>
  </div>
  <p class="form-error" data-auth-error hidden></p>
  <p class="form-success" data-auth-success hidden></p>
  <label>Email
    <input name="email" type="email" autocomplete="email" required>
  </label>
  <button class="dos-btn primary" type="submit">Send Reset Link</button>
  <div class="auth-links">
    <a href="/login">Back to login</a>
  </div>
</form>
{% endblock %}
