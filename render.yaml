services:
  - type: web
    name: d-os
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: D-OS
      - key: SESSION_COOKIE_NAME
        value: dos_session
      - key: SECRET_KEY
        sync: false
      - key: SESSION_DAYS
        value: "7"
      - key: DEFAULT_CURRENCY
        value: ₹
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_HOST
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_API_KEY
        value: AIzaSyAGTO-nn4leLu5rji8TpeweEfRLwFcgJvE
      - key: FIREBASE_AUTH_DOMAIN
        value: d-os-59476.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: d-os-59476
      - key: FIREBASE_STORAGE_BUCKET
        value: d-os-59476.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "460980841419"
      - key: FIREBASE_APP_ID
        value: 1:460980841419:web:d120e639dde0e16297244e
      - key: FIREBASE_MEASUREMENT_ID
        value: G-ZSC2R0TLNP
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_CLIENT_CERT_URL
        sync: false
